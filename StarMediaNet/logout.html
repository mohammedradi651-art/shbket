<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم تسجيل الخروج | ستار ميديا</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background: #0a192f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .box {
      max-width: 360px;
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      height: 48px;
      line-height: 48px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 800;
      border-radius: 12px;
      text-decoration: none;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size: 40px; margin-bottom: 12px;">👋</div>
    <h2 style="color: #38bdf8; margin-bottom: 8px;">تم تسجيل الخروج</h2>
    <p style="color: #94a3b8; font-size: 13px;">تم قطع الاتصال بالإنترنت بنجاح.</p>

</html>
