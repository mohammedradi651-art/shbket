<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="2; url=$(link-redirect)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جارٍ الاتصال... | ستار ميديا</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background: #0a192f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2 style="color: #38bdf8; margin-bottom: 8px;">تم تسجيل الدخول بنجاح!</h2>
  <p style="color: #94a3b8; font-size: 14px;">أهلاً بك في شبكة ستار ميديا، جارٍ تحويلك...</p>
  <script>
    setTimeout(function() {
      window.location.href = '$(link-redirect)';
    }, 1500);
  </script>
</body>
</html>
